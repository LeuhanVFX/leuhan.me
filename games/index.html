<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Jeux | Leuhan</title>
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <header>
            <nav class="menu">
                <a onclick="window.scrollTo({ top: 0, behavior: 'smooth' })" class="logo">
                    <img src="assets/logo.png" alt="Logo de Leuhan" style="width: 3vw;">
                </a>
                <h1 class="game_logo">GAMES</h1>
                <div class="theme-toggle">
                <div class="toggleWrapper">
                    <input class="input" id="dn" type="checkbox" checked />
                    <label class="toggle" for="dn">
                        <span class="toggle__handler">
                            <span class="crater crater--1"></span>
                            <span class="crater crater--2"></span>
                            <span class="crater crater--3"></span>
                        </span>
                        <span class="star star--1"></span>
                        <span class="star star--2"></span>
                        <span class="star star--3"></span>
                        <span class="star star--4"></span>
                        <span class="star star--5"></span>
                        <span class="star star--6"></span>
                    </label>
                </div>
            </div>
            </nav>
        </header>
        <main>

        </main>
        <footer>
            <a href="/legals/">
                Legal Mentions
            </a>
        </footer>
</html>
